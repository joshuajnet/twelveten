name: twelveten

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: twelveten
      POSTGRES_PASSWORD: twelveten
      POSTGRES_DB: twelveten
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U twelveten -d twelveten']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
